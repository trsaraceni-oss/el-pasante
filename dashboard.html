<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Pasante — Legajos del equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --plane:      #0a0a0a;
    --surface:    #151515;
    --surface-2:  #1c1c1c;
    --ink:        #ffffff;
    --ink-2:      #c3c2b7;
    --ink-muted:  #898781;
    --grid:       #2c2c2a;
    --baseline:   #383835;
    --hairline:   rgba(255,255,255,0.10);
    --desempeno:  #3987e5;
    --reputacion: #d95926;
    --red:        #199e70;
    --energia:    #c98500;
    --sans: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: 'Oswald', 'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--plane);color:var(--ink);font-family:var(--sans);}
  body{padding:clamp(14px,2vw,32px);}
  .wrap{max-width:1800px;margin:0 auto;}

  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:clamp(14px,1.6vw,24px);}
  .eyebrow{font-weight:700;font-size:clamp(10px,.8vw,12px);letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:7px;}
  .stripes{display:inline-flex;gap:2px;}
  .stripes i{width:3px;height:11px;background:var(--ink);display:block;transform:skewX(-14deg);}
  .stripes i:nth-child(2){height:15px;}
  .stripes i:nth-child(3){height:19px;}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,3vw,46px);line-height:1.05;margin:0;text-transform:uppercase;}
  .meta{display:flex;align-items:center;gap:clamp(14px,1.6vw,26px);flex-wrap:wrap;}
  .contador{display:flex;align-items:baseline;gap:9px;}
  .contador b{font-weight:700;font-size:clamp(26px,2.6vw,42px);line-height:1;font-variant-numeric:tabular-nums;}
  .contador span{font-size:clamp(10px,.85vw,12px);color:var(--ink-muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600;}
  .status{display:flex;align-items:center;gap:9px;font-size:clamp(11px,.9vw,13px);color:var(--ink-muted);white-space:nowrap;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--desempeno);flex:none;animation:pulso 2s ease-in-out infinite;}
  .dot.err{background:var(--reputacion);animation:none;}
  @keyframes pulso{0%,100%{opacity:1;}50%{opacity:.25;}}

  .barra-sup{display:flex;flex-wrap:wrap;align-items:center;gap:16px 22px;padding:12px 0 clamp(14px,1.6vw,22px);border-bottom:1px solid var(--grid);margin-bottom:clamp(14px,1.6vw,22px);}
  .leg{display:flex;align-items:center;gap:7px;font-size:clamp(10px,.85vw,12.5px);color:var(--ink-2);}
  .leg i{width:11px;height:11px;border-radius:2px;display:block;}
  .btn{margin-left:auto;background:transparent;border:1px solid var(--grid);color:var(--ink-muted);font-family:var(--sans);font-size:clamp(10px,.85vw,12px);padding:7px 13px;border-radius:2px;cursor:pointer;}
  .btn:hover{border-color:var(--baseline);color:var(--ink);}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,17vw,280px);gap:clamp(14px,1.6vw,24px);align-items:start;}
  @media (max-width:1000px){ .layout{grid-template-columns:minmax(0,1fr);} }

  .legajos{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:clamp(10px,1.1vw,16px);}

  /* ---------- legajo ---------- */
  .legajo{background:linear-gradient(160deg,var(--surface-2),#101010);border:1px solid var(--hairline);border-radius:2px;padding:clamp(13px,1.2vw,18px);display:flex;flex-direction:column;gap:12px;}
  .legajo.nuevo{animation:entrar .45s cubic-bezier(.22,.61,.36,1);}
  @keyframes entrar{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
  .lg-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .lg-nombre{font-family:var(--display);font-weight:600;font-size:clamp(16px,1.5vw,23px);text-transform:uppercase;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lg-ronda{font-size:clamp(9px,.75vw,11px);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-muted);border:1px solid var(--grid);border-radius:2px;padding:3px 7px;flex:none;font-variant-numeric:tabular-nums;}

  .stats{display:flex;flex-direction:column;gap:9px;}
  .stat-lbl{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:clamp(10px,.85vw,12.5px);margin-bottom:4px;}
  .stat-nom{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:600;letter-spacing:.03em;text-transform:uppercase;}
  .stat-nom i{width:9px;height:9px;border-radius:2px;display:block;flex:none;}
  .stat-val{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;font-size:clamp(11px,.95vw,14px);}
  .track{height:7px;background:var(--grid);border-radius:2px;overflow:hidden;}
  .fill{height:100%;border-radius:0 4px 4px 0;width:0;transition:width .7s cubic-bezier(.22,.61,.36,1);}

  .final{border-top:1px dashed var(--grid);padding-top:11px;margin-top:2px;opacity:0;transition:opacity .45s ease;}
  .final.visible{opacity:1;}
  .final-tag{font-size:clamp(9px,.72vw,10.5px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;margin-bottom:5px;color:var(--ink-muted);}
  .final-tag i{width:8px;height:8px;border-radius:2px;display:block;}
  .final-txt{font-size:clamp(12px,1.05vw,15px);font-weight:500;line-height:1.4;color:var(--ink);}
  .esperando{font-size:clamp(11px,.9vw,13px);color:var(--ink-muted);font-style:italic;}

  /* ---------- lateral ---------- */
  .side{display:flex;flex-direction:column;gap:clamp(12px,1.4vw,20px);position:sticky;top:clamp(14px,2vw,32px);}
  .panel{background:var(--surface);border:1px solid var(--hairline);border-radius:2px;padding:clamp(14px,1.4vw,22px);}
  .panel-title{font-family:var(--display);font-weight:600;font-size:clamp(14px,1.15vw,18px);text-transform:uppercase;margin:0 0 4px;}
  .panel-sub{font-size:clamp(10px,.85vw,12.5px);color:var(--ink-muted);margin:0 0 13px;}
  .qr-box{background:#ffffff;padding:11px;border-radius:2px;display:flex;align-items:center;justify-content:center;}
  .qr-box{overflow:hidden;}
  .qr-box canvas{display:none !important;}
  .qr-box img{display:block !important;width:100% !important;height:auto !important;max-width:100% !important;}
  .qr-url{font-size:clamp(9px,.8vw,11.5px);color:var(--ink-muted);word-break:break-all;margin:9px 0 0;line-height:1.45;}

  .vacio{grid-column:1/-1;text-align:center;padding:clamp(34px,6vw,86px) 16px;color:var(--ink-muted);border:1px dashed var(--grid);border-radius:2px;}
  .vacio strong{display:block;font-family:var(--display);font-size:clamp(17px,1.8vw,26px);color:var(--ink);text-transform:uppercase;margin-bottom:8px;font-weight:600;}
  [hidden]{display:none !important;}

  table{width:100%;border-collapse:collapse;margin-top:16px;font-size:clamp(10px,.9vw,13px);}
  caption{text-align:left;color:var(--ink-muted);font-size:12px;padding-bottom:8px;}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--grid);}
  th{color:var(--ink-muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(9px,.75vw,11px);}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow"><span class="stripes"><i></i><i></i><i></i></span>El Pasante · Team huddle</div>
      <h1>Legajos del equipo</h1>
    </div>
    <div class="meta">
      <div class="contador"><b id="total">—</b><span>anotados</span></div>
      <div class="status"><span class="dot" id="dot"></span><span id="estado">Conectando…</span></div>
    </div>
  </header>

  <div class="barra-sup">
    <span class="leg"><i style="background:var(--desempeno)"></i>Desempeño</span>
    <span class="leg"><i style="background:var(--reputacion)"></i>Reputación</span>
    <span class="leg"><i style="background:var(--red)"></i>Red</span>
    <span class="leg"><i style="background:var(--energia)"></i>Energía</span>
    <button class="btn" id="toggle-tabla" aria-expanded="false">Ver tabla</button>
  </div>

  <div class="layout">
    <main>
      <div class="legajos" id="legajos"></div>

      <table id="tabla" hidden>
        <caption>Los mismos legajos, en tabla.</caption>
        <thead><tr>
          <th scope="col">Nombre</th><th scope="col" class="num">Desempeño</th><th scope="col" class="num">Reputación</th>
          <th scope="col" class="num">Red</th><th scope="col" class="num">Energía</th>
          <th scope="col" class="num">Ronda</th><th scope="col">Final</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </main>

    <div class="side">
      <section class="panel">
        <h2 class="panel-title">Jugá ahora</h2>
        <p class="panel-sub">Escaneá, poné tu nombre y aparecés acá.</p>
        <div class="qr-box" id="qr"></div>
        <p class="qr-url" id="qr-url"></p>
      </section>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwQQKku8p7eEIh1Jt8vVl3_OTAUZTXeM_b4LL_2eLbbRT9vd6NaruwGi9fmLwtoPNG6vw/exec";
const JUEGO = "https://trsaraceni-oss.github.io/el-pasante/";
const REFRESCO_MS = 10000;
const TOTAL_RONDAS = 10;

const STATS = [
  {k:"desempeno",  n:"Desempeño",  c:"desempeno"},
  {k:"reputacion", n:"Reputación", c:"reputacion"},
  {k:"red",        n:"Red",        c:"red"},
  {k:"energia",    n:"Energía",    c:"energia"}
];

// Los finales que cierran el legajo; el resto son placa de reconocimiento.
const CIERRES = [
  "Meseta. Te quedaste en el medio.",
  "Massive layoff. Quedás afuera.",
  "Burnout. Te bajás del barco.",
  "Te desvinculan."
];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const clamp = n => Math.max(0, Math.min(100, Number(n) || 0));
const vistos = new Set();

function claveDe(p){ return p.nombre + "|" + p.fecha; }

function tarjeta(p, nueva){
  const cierre = CIERRES.indexOf(p.final) !== -1;
  const barras = STATS.map(s => `
    <div>
      <div class="stat-lbl">
        <span class="stat-nom"><i style="background:var(--${s.c})"></i>${s.n}</span>
        <span class="stat-val">${clamp(p[s.k])}</span>
      </div>
      <div class="track"><div class="fill" style="background:var(--${s.c})" data-w="${clamp(p[s.k])}"></div></div>
    </div>`).join("");

  return `<article class="legajo ${nueva ? "nuevo" : ""}" data-clave="${esc(claveDe(p))}">
    <div class="lg-top">
      <span class="lg-nombre">${esc(p.nombre)}</span>
      <span class="lg-ronda">Ronda ${Number(p.ronda) || 0}/${TOTAL_RONDAS}</span>
    </div>
    <div class="stats">${barras}</div>
    <div class="final">
      <div class="final-tag"><i style="background:var(--${cierre ? "reputacion" : "desempeno"})"></i>${cierre ? "Cierre de legajo" : "Placa de reconocimiento"}</div>
      <div class="${p.final ? "final-txt" : "esperando"}">${p.final ? esc(p.final) : "Partida sin final registrado"}</div>
    </div>
  </article>`;
}

function pintar(datos){
  const partidas = Array.isArray(datos.partidas) ? datos.partidas.slice() : [];
  partidas.reverse(); // el último que se anotó, primero

  $("total").textContent = Number(datos.total) || partidas.length;

  if(partidas.length === 0){
    $("legajos").innerHTML = `<div class="vacio"><strong>Todavía no se anotó nadie</strong>Escaneá el QR, poné tu nombre y tu legajo aparece acá.</div>`;
    $("tbody").innerHTML = "";
  }else{
    const primeraCarga = vistos.size === 0;
    $("legajos").innerHTML = partidas.map(p => {
      const nueva = !primeraCarga && !vistos.has(claveDe(p));
      return tarjeta(p, nueva);
    }).join("");
    partidas.forEach(p => vistos.add(claveDe(p)));

    // Primero cargan las stats, después aparece el final.
    requestAnimationFrame(() => {
      document.querySelectorAll(".fill").forEach(el => { el.style.width = el.dataset.w + "%"; });
    });
    setTimeout(() => {
      document.querySelectorAll(".final").forEach(el => el.classList.add("visible"));
    }, 750);

    $("tbody").innerHTML = partidas.map(p => `<tr>
      <td>${esc(p.nombre)}</td>
      <td class="num">${clamp(p.desempeno)}</td><td class="num">${clamp(p.reputacion)}</td>
      <td class="num">${clamp(p.red)}</td><td class="num">${clamp(p.energia)}</td>
      <td class="num">${Number(p.ronda) || 0}</td><td>${esc(p.final)}</td></tr>`).join("");
  }

  const hora = new Date(datos.actualizado || Date.now())
    .toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  $("dot").className = "dot";
  $("estado").textContent = "En vivo · " + hora;
}

async function traer(){
  try{
    const r = await fetch(ENDPOINT + "?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    pintar(await r.json());
  }catch(err){
    $("dot").className = "dot err";
    $("estado").textContent = "Sin conexión con la planilla, reintentando…";
  }
}

$("toggle-tabla").addEventListener("click", () => {
  const t = $("tabla"), abierta = !t.hidden;
  t.hidden = abierta;
  $("toggle-tabla").textContent = abierta ? "Ver tabla" : "Ocultar tabla";
  $("toggle-tabla").setAttribute("aria-expanded", String(!abierta));
});

$("qr-url").textContent = JUEGO;
try{
  if(typeof QRCode !== "undefined"){
    new QRCode($("qr"), {text: JUEGO, width: 420, height: 420,
      colorDark: "#0a0a0a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M});
  }else{ $("qr").remove(); }
}catch(e){ $("qr").remove(); }

traer();
setInterval(traer, REFRESCO_MS);
</script>
</body>
</html>
